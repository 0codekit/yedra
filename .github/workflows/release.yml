name: Release

on:
  release:
    types: [published]

# Nothing is granted by default, so each job states exactly what it needs.
permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm trusted publishing: the job exchanges this OIDC token
      # for a short-lived registry credential, so there is no npm token stored
      # in the repository. It is also what signs the provenance attestation.
      id-token: write
    steps:
      # A release event checks out the commit the tag points at, but naming the
      # tag says what is being published rather than leaving it implied.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          # Trusted publishing needs Node 22.14 or newer. This is the newest
          # line CI covers; the package itself still supports 22.15 upwards,
          # which the CI matrix is what proves.
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The version is bumped in the commit that makes the change, not at
      # release time, so the tag and `package.json` are written days apart and
      # can disagree. Publishing the wrong version is not something npm lets
      # you take back — a version number can never be reused, even after
      # unpublishing — so it is checked before anything is sent.
      - name: Verify package.json matches the release tag
        env:
          # Passed through the environment rather than interpolated into the
          # script, so a tag name can never be read as shell.
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match package.json version $version" >&2
            exit 1
          fi

      # `prepublishOnly` runs check, typecheck, test and build, so this repeats
      # the CI gates against the exact tree being published. That is worth the
      # duplicated minutes here: CI passing on a branch says nothing about the
      # tag if the two ever diverge.
      #
      # `--no-git-checks` because pnpm otherwise refuses to publish from the
      # detached HEAD a tag checkout produces. `--provenance` publishes a signed
      # attestation linking these bytes to this workflow run.
      - name: Publish to npm
        run: pnpm publish --provenance --no-git-checks
