name: Release

on:
  release:
    types: [published]

# Nothing is granted by default, so each job states exactly what it needs.
permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm trusted publishing: the job exchanges this OIDC token
      # for a short-lived registry credential, so there is no npm token stored
      # in the repository. It is also what signs the provenance attestation.
      id-token: write
    steps:
      # A release event checks out the commit the tag points at, but naming the
      # tag says what is being published rather than leaving it implied.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          # Trusted publishing needs Node 22.14 or newer. This is the newest
          # line CI covers; the package itself still supports 22.15 upwards,
          # which the CI matrix is what proves.
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The version is bumped in the commit that makes the change, not at
      # release time, so the tag and `package.json` are written days apart and
      # can disagree. Publishing the wrong version is not something npm lets
      # you take back — a version number can never be reused, even after
      # unpublishing — so it is checked before anything is sent.
      - name: Verify package.json matches the release tag
        env:
          # Passed through the environment rather than interpolated into the
          # script, so a tag name can never be read as shell.
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match package.json version $version" >&2
            exit 1
          fi

      # Staged rather than published outright: the tarball goes to npm's stage
      # queue, where it is invisible to `pnpm install` until a maintainer
      # approves it from a trusted device with a 2FA challenge. That is the
      # point of the exercise — a workflow cannot answer a 2FA prompt, so
      # anything that publishes straight from CI is only as trustworthy as its
      # credentials, and this puts a human back in front of the release without
      # making CI interactive.
      #
      # `pnpm stage publish` takes the same arguments as `pnpm publish` and runs
      # the same lifecycle scripts, so `prepublishOnly` still gates this on
      # check, typecheck, test and build against the exact tree being staged.
      # That is worth the duplicated minutes: CI passing on a branch says
      # nothing about the tag if the two ever diverge.
      #
      # `--no-git-checks` because pnpm otherwise refuses to publish from the
      # detached HEAD a tag checkout produces. `--provenance` attaches a signed
      # attestation linking these bytes to this workflow run.
      - name: Stage for publishing
        run: pnpm stage publish --provenance --no-git-checks

      # The job cannot finish the release, so it says so where the person who
      # can will look.
      - name: Explain how to approve
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          {
            echo "### $TAG is staged, not published"
            echo
            echo 'It is invisible to `pnpm install` until approved:'
            echo
            echo '```'
            echo 'pnpm stage list yedra   # find the stage id'
            echo 'pnpm stage view <id>    # check what is in the tarball'
            echo 'pnpm stage approve <id> # 2FA challenge, then it goes live'
            echo '```'
            echo
            echo 'Or use the Staged Packages tab on npmjs.com.'
          } >> "$GITHUB_STEP_SUMMARY"
